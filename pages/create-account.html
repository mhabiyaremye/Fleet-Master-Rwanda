<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link rel="stylesheet" href="../Css-styles/create-account.css" />
  </head>
  <body>
    <header><h1>Create Account</h1></header>
    <div class="registration-form-container">
      <section class="registration-form">
        <input id="first-name" type="text" placeholder="First name " />
        <input id="last-name" type="text" placeholder="Lastname " />
        <input id="employee-id" type="text" placeholder="Employee ID" />
        <p>Gender</p>

        <label>
          <input type="radio" name="gender" value="male" />
          Male
        </label>

        <label>
          <input type="radio" name="gender" value="female" />
          Female
        </label>
        <input type="email" id="email" ="email" placeholder="Email" />
        <input
          type="password"
          id="password"
          ="password"
          placeholder="Password"
        />
        <input
          type="password"
          id="confirm-password"
          ="password"
          placeholder="Confirm Password"
        />
        <button id="submit-button">Submit</button>
      </section>
    </div>
    <script src="../registration.js"></script>
  </body>
</html>
