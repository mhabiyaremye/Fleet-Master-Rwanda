    <section>

            <p class="comments">Don't have an account ?</p>
            <a href="./pages/create-account.html">Create account</a>
          </div>
          <div id="success-dialog">
            <div id="success-dialog-content">
              <h2>Login Successful!</h2>
              <p>Welcome to Fleet Master Ops.</p>
              <button id="continue-button">Continue</button>
            </div>
          </div>
        </div>
      </div>
